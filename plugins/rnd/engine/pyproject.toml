[project]
name = "rnd"
version = "0.2.0"
description = "RnD engine: precise, token-cheap Office/PDF extraction, workspace search, data SQL, citation verification and rendering for Claude Code."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-pptx>=1.0",
  "pypdf>=5.0",
  "pdfplumber>=0.11",
  "duckdb>=1.1",
  "markdown-it-py>=3.0",
  "reportlab>=4.2",
  "httpx>=0.27",
  "trafilatura>=1.12",
  "mcp>=2.2,<3",
]

[project.optional-dependencies]
semantic = ["fastembed>=0.4", "numpy>=1.26"]

[project.scripts]
rnd = "rnd.cli:main"
rnd-mcp = "rnd.mcp_server:main"
rnd-hook = "rnd.hooks:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rnd"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# E501: long SQL/f-strings read better unwrapped; RUF001-003: we print ×, ·, – on purpose
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM105", "SIM108", "B905"]
